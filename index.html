<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Uploader</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#18202a}.wrap{max-width:720px;margin:50px auto;padding:20px}.card{background:#fff;border:1px solid #e5e9f0;border-radius:18px;padding:28px;box-shadow:0 8px 30px #0000000d}h1{margin:0 0 8px}.sub{color:#697586}.drop{display:block;border:2px dashed #b8c2d1;border-radius:16px;padding:45px 20px;text-align:center;cursor:pointer;background:#fafbfc}.drop strong{display:block;font-size:18px;margin-bottom:8px}.drop span{color:#7a8699;font-size:14px}input[type=file]{display:none}.row{display:flex;gap:10px;margin-top:16px}.row input{flex:1;padding:12px;border:1px solid #d9dee7;border-radius:10px}button{border:0;border-radius:10px;padding:12px 18px;background:#2463eb;color:#fff;font-weight:600;cursor:pointer}button:disabled{opacity:.5}.settings{margin-top:22px;padding-top:22px;border-top:1px solid #edf0f4}.settings label{display:block;font-size:13px;font-weight:bold;margin:12px 0 6px}.settings input{width:100%;padding:11px;border:1px solid #d9dee7;border-radius:10px}.hint,.small{font-size:12px;color:#7a8699;line-height:1.6}.status{margin-top:18px;padding:12px;border-radius:10px;background:#f4f6f9;display:none}.status.show{display:block}.result{margin-top:18px;display:none}.url{display:flex;gap:8px}.url input{flex:1;padding:11px;border:1px solid #d9dee7;border-radius:10px}.result img{max-width:100%;max-height:280px;margin-top:12px;border-radius:10px}</style></head>
<body><div class="wrap"><div class="card"><h1>Image Uploader</h1><p class="sub">上传图片并生成 HTTPS 图片地址</p>
<label class="drop" id="drop"><input id="file" type="file" accept="image/*"><strong>点击选择图片，或拖拽到这里</strong><span>支持 JPG / PNG / GIF / WEBP / SVG，单张建议不超过 20MB</span></label>
<div class="row"><input id="filename" placeholder="文件名，可留空"><button id="upload" disabled>上传图片</button></div><div id="status" class="status"></div>
<div id="result" class="result"><div class="small">HTTPS 图片地址</div><div class="url"><input id="url" readonly><button id="copy">复制</button></div><img id="preview"></div>
<div class="settings"><label>GitHub 用户名</label><input id="owner" value="mywebcloudrelam"><label>GitHub Pages 仓库</label><input id="repo" value="mywebcloudrelam.github.io"><label>GitHub Fine-grained Token</label><input id="token" type="password" placeholder="粘贴 Token"><p class="hint">Token 仅保存在当前浏览器的 localStorage，不会写入本页面源码。建议只给这个仓库 Contents: Read and write 权限。</p><button id="save">保存配置</button> <button id="clear">清除 Token</button></div></div></div>
<script>const $=id=>document.getElementById(id);let file=null;const saved=JSON.parse(localStorage.getItem('ghu')||'{}');if(saved.owner)$('owner').value=saved.owner;if(saved.repo)$('repo').value=saved.repo;if(saved.token)$('token').value=saved.token;function status(t,ok=false){$('status').textContent=t;$('status').className='status show';$('status').style.background=ok?'#eefaf1':'#f4f6f9'}function name(s){return s.normalize('NFKC').replace(/[^a-zA-Z0-9._-]/g,'-').replace(/-+/g,'-')}function choose(f){if(!f.type.startsWith('image/'))return status('请选择图片。');if(f.size>20*1024*1024)return status('图片超过 20MB。');file=f;$('filename').value=name(f.name);$('upload').disabled=false;status('已选择：'+f.name+'（'+(f.size/1024/1024).toFixed(2)+' MB）')}$('drop').onclick=()=>$('file').click();$('file').onchange=e=>e.target.files[0]&&choose(e.target.files[0]);$('drop').ondragover=e=>{e.preventDefault();$('drop').style.borderColor='#2463eb'};$('drop').ondragleave=()=>$('drop').style.borderColor='';$('drop').ondrop=e=>{e.preventDefault();$('drop').style.borderColor='';e.dataTransfer.files[0]&&choose(e.dataTransfer.files[0])};$('save').onclick=()=>{localStorage.setItem('ghu',JSON.stringify({owner:$('owner').value.trim(),repo:$('repo').value.trim(),token:$('token').value.trim()}));status('配置已保存。')};$('clear').onclick=()=>{localStorage.removeItem('ghu');$('token').value='';status('Token 已清除。')};$('copy').onclick=async()=>{await navigator.clipboard.writeText($('url').value);$('copy').textContent='已复制';setTimeout(()=>$('copy').textContent='复制',1000)};$('upload').onclick=async()=>{const owner=$('owner').value.trim(),repo=$('repo').value.trim(),token=$('token').value.trim();if(!file||!owner||!repo||!token)return status('请填写 Token 并选择图片。');$('upload').disabled=true;status('正在上传……');try{const b=new Uint8Array(await file.arrayBuffer());let bin='';for(let i=0;i<b.length;i+=8192)bin+=String.fromCharCode(...b.subarray(i,i+8192));const n=Date.now()+'-'+name($('filename').value.trim()||file.name);const path='images/'+n;const api='https://api.github.com/repos/'+encodeURIComponent(owner)+'/'+encodeURIComponent(repo)+'/contents/'+path.split('/').map(encodeURIComponent).join('/');const r=await fetch(api,{method:'PUT',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},body:JSON.stringify({message:'Upload image: '+n,content:btoa(bin)})});const d=await r.json();if(!r.ok)throw Error(d.message||r.status);const url='https://'+owner+'.github.io/'+(repo===owner+'.github.io'?'':repo+'/')+path;$('url').value=url;$('preview').src=url;$('result').style.display='block';status('上传成功！',true)}catch(e){status('上传失败：'+e.message)}finally{$('upload').disabled=!file}}</script></body></html>
